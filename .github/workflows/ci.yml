name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache packages and Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # rustup gets the Rust version of rust-toolchain.toml at the first cargo command.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Host checks (rustfmt, clippy, cargo test)
        run: bun run host:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # Sizes of the built files against apps/desktop/perf/size-baseline.json (docs/performance.md).
      # Times, CPU use and memory are measured by hand with "bun run perf" and never fail CI.
      - run: bun run build
      - run: bun run sizes

  # Decides if the e2e job runs. It always runs on a push to main. On a pull request it is skipped
  # when every changed file is in the list below: files that the desktop app and its end-to-end
  # tests do not use. A path that is not in the list runs the suite, so a new folder is safe.
  # The unit tests that read README.md and docs/ run in the check job, which always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      # On a pull request HEAD is a merge commit and HEAD^1 is the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          ignored='^(docs|specs|apps/mobile|\.githooks)/|\.md$|^LICENSE$|^\.github/(assets/|pull_request_template\.md$|workflows/release\.yml$)'
          e2e=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files="$(git diff --name-only HEAD^1 HEAD)"; then
            if [ -z "$(printf '%s\n' "$files" | grep -v -E "$ignored" || true)" ]; then
              e2e=false
            fi
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e"

  # The suite runs in two parts on two runners; each part runs its tests in parallel.
  # The app is for Macs with Apple silicon only (specs/000-product.md), so the suite runs on
  # macos-latest, an Apple silicon runner.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache packages and Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: End-to-end tests
        run: bun run e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: build/e2e
          retention-days: 7
