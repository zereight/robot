name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache packages and Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # rustup gets the Rust version of rust-toolchain.toml at the first cargo command.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Host checks (rustfmt, clippy, cargo test)
        run: bun run host:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # Sizes, times, CPU use and memory are measured by hand and never fail CI (docs/performance.md).
      - run: bun run build
