name: Release

# A tag `v<version>` builds, tests and attaches the app (macOS, Apple silicon) to a draft release.
# "Run workflow", and PRs that change packaging, build and test the same way without a release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/scripts/packaged-path.ts
      - apps/desktop/package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache packages and Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version apps/desktop/package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  # Packaging starts at once, beside verify. The release job waits for both.
  # The desktop app is for Macs with Apple silicon only (specs/000-product.md), so this is the
  # only build. macos-latest is an Apple silicon runner.
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Packages, the Electron download and the files that electron-builder fetches.
      - name: Cache packages and Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: package-macos-arm64-${{ hashFiles('bun.lock') }}
          restore-keys: package-macos-arm64-
      - run: bun install --frozen-lockfile
      - name: Build and package
        working-directory: apps/desktop
        run: |
          bun run build
          bunx electron-builder --mac --arm64 --publish never
      - name: End-to-end tests against the packaged app
        working-directory: apps/desktop
        run: |
          export ROBOT_E2E_APP="$(bun scripts/packaged-path.ts)"
          bunx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos-arm64
          path: |
            dist/desktop/ROBot-*
            !dist/desktop/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-macos-arm64
          path: build/e2e
          retention-days: 7

  release:
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum ROBot-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "ROBot ${GITHUB_REF_NAME#v}")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/*
