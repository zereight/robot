# Packaging for macOS on Apple silicon only. See docs/release.md.
appId: io.github.zereight.robot
productName: ROBot
copyright: Copyright © 2026 zereight
directories:
  output: ../../dist/desktop
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/*.node"
artifactName: ROBot-${version}-${os}-${arch}.${ext}
npmRebuild: false
# The workspace name (@robot/desktop) is not a valid package or file name.
extraMetadata:
  name: robot
publish: null

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  # Ad-hoc signature until a Developer ID is available. Apple silicon needs at least this.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  sign: false
