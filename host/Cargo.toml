[package]
name = "robot-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The host process of ROBot: the work of the app, apart from the windows."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
